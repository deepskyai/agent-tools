name: Retire io.github MCP listing
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Login and mark deleted
        run: |
          ./mcp-publisher login github-oidc
          echo y | ./mcp-publisher status --status deleted --message "Republished under com.deepskyai/aviation-regulations" --all-versions io.github.deepskyai/aviation-regulations
